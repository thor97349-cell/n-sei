# Testa e gera os executáveis do jogo "Entrega Impossível" (pasta entrega-impossivel-pc).
#  • A cada push que mexe no jogo: roda os testes automáticos, exporta Windows + Linux e
#    publica os .zip na Release "entrega-latest" (aba Releases do repositório).
#  • Ao criar uma tag "entrega-v*" (ex.: entrega-v0.1.0): publica uma Release fixa com esse nome.
# Não usa nenhuma "action" de terceiros (só comandos), então funciona mesmo com a regra
# "Require actions to be pinned to a full-length commit SHA" ligada.
name: Entrega Impossível (PC)

on:
  push:
    paths:
      - "entrega-impossivel-pc/**"
      - ".github/workflows/entrega-impossivel-pc.yml"
    tags:
      - "entrega-v*"
  pull_request:
    paths:
      - "entrega-impossivel-pc/**"
  workflow_dispatch:

permissions:
  contents: write

# Um envio novo cancela a execução anterior do mesmo branch (economiza minutos).
concurrency:
  group: entrega-impossivel-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: entrega-impossivel-pc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Baixar Godot ${{ env.GODOT_VERSION }} e os modelos de exportação
        run: |
          set -e
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          TEMPLATES=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATES"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o -j /tmp/templates.tpz templates/version.txt templates/linux_release.x86_64 templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$TEMPLATES"
          rm /tmp/templates.tpz
          ~/godot/godot --version

      - name: Importar o projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: ~/godot/godot --headless --path . --import || true

      - name: Testes automáticos
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ~/godot/godot --headless --path . res://tests/compile_check.tscn
          ~/godot/godot --headless --path . res://tests/career_test.tscn
          ~/godot/godot --headless --fixed-fps 120 --path . res://tests/vehicle_test.tscn
          ~/godot/godot --headless --fixed-fps 120 --path . res://tests/handling_test.tscn
          ~/godot/godot --headless --fixed-fps 60 --path . res://tests/gameplay_test.tscn
          ~/godot/godot --headless --fixed-fps 60 --path . res://tests/loop_test.tscn
          ~/godot/godot --headless --fixed-fps 60 --path . res://tests/traffic_test.tscn -- 120
          ~/godot/godot --headless --fixed-fps 60 --path . res://tests/pedestrian_test.tscn

      - name: Exportar Windows e Linux
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/EntregaImpossivel.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/EntregaImpossivel.x86_64
          chmod +x build/linux/EntregaImpossivel.x86_64
          for dir in build/windows build/linux; do
            cp README.md CREDITS.md "$dir/"
            mkdir -p "$dir/licencas" && cp assets/fonts/OFL*.txt "$dir/licencas/"
          done
          # O jogo exportado precisa abrir sem erros.
          timeout 120 ./build/linux/EntregaImpossivel.x86_64 --headless --quit-after 300 2>&1 | tee /tmp/run.log
          if grep -q "SCRIPT ERROR" /tmp/run.log; then echo "O jogo exportado mostrou erros de script"; exit 1; fi
          (cd build/windows && zip -qr ../EntregaImpossivel-windows.zip .)
          (cd build/linux && zip -qr ../EntregaImpossivel-linux.zip .)
          ls -la build/*.zip

      - name: Publicar os downloads (Releases)
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="Descompacte e abra EntregaImpossivel.exe (Windows) ou EntregaImpossivel.x86_64 (Linux). Gerado do commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME})."
          if [[ "$GITHUB_REF" == refs/tags/entrega-v* ]]; then
            gh release create "$GITHUB_REF_NAME" build/EntregaImpossivel-windows.zip build/EntregaImpossivel-linux.zip \
              --repo "$GITHUB_REPOSITORY" --title "Entrega Impossível $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete entrega-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            gh release create entrega-latest build/EntregaImpossivel-windows.zip build/EntregaImpossivel-linux.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Entrega Impossível — versão mais recente (teste)" --notes "$NOTES"
          fi
          echo "Downloads: https://github.com/${GITHUB_REPOSITORY}/releases/tag/entrega-latest"
